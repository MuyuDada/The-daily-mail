name: daily-mail

on:
  schedule:
    # 注意：cron 使用 UTC 时间，北京时间 = UTC + 8
    #
    # 为什么配三档：GitHub 的 schedule 在高负载时会被延迟，甚至整次被丢弃
    # （官方文档原话：some queued jobs may be dropped）。所以这里连着排几个
    # 时间点，前一档迟到或被丢掉时后一档能补上。
    # 同一天不会重复发送：index.js 会读仓库里的 .last-sent，发过就跳过。
    #
    # 三档分别是北京时间 08:02 / 09:02 / 10:02
    - cron: "02 00 * * *"
    - cron: "02 01 * * *"
    - cron: "02 02 * * *"
  # 支持在 Actions 页面手动点一下立即运行，方便调试
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    # 发送成功后要把 .last-sent 提交回仓库，所以需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装中文字体与浏览器
        run: |
          sudo apt-get update -qq
          # 不装中文字体的话，卡片图里的中文会变成方框
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          # 运行器一般自带 Chrome；万一没有就用 chromium 兜底
          if ! command -v google-chrome >/dev/null 2>&1 && [ ! -x /usr/bin/google-chrome ]; then
            sudo apt-get install -y -qq chromium-browser || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
      - name: Run Project
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置这些 Secret
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
          TIANXING_KEY: ${{ secrets.TIANXING_KEY }}
          # 以下是可选配置，不配也有默认值
          WEATHER_LOCATION: ${{ secrets.WEATHER_LOCATION }}
          MAIL_CITY: ${{ secrets.MAIL_CITY }}
          START_DAY: ${{ secrets.START_DAY }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_SUBJECT: ${{ secrets.MAIL_SUBJECT }}
          # TA 那边的天气（不配则用代码里的默认城市）
          WEATHER_LOCATION_TA: ${{ secrets.WEATHER_LOCATION_TA }}
          MAIL_CITY_TA: ${{ secrets.MAIL_CITY_TA }}
          MAIL_LOVE_NAME: ${{ secrets.MAIL_LOVE_NAME }}
          MAIL_SIGNATURE: ${{ secrets.MAIL_SIGNATURE }}
          # 卡片配色：不配则按天数每天换一种马卡龙色
          MAIL_THEME: ${{ secrets.MAIL_THEME }}
          # 调试用：设为 1 可以无视「今天已发过」的标记强制重发一次
          FORCE_SEND: ${{ vars.FORCE_SEND }}
        run: npm ci && npm run server
      # 把「今天已发送」的标记提交回仓库，供下一档 cron 判断要不要跳过。
      # 顺带让仓库每天都有一次提交，避免 public 仓库 60 天无活动被自动禁用定时任务。
      - name: 记录发送日期
        if: success()
        run: |
          if [ ! -f .last-sent ]; then
            echo "没有生成 .last-sent（可能是今天已经发过、本次跳过了），无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-sent
          # 用 --cached 判断：这样文件是新建（未跟踪）还是内容变了都能识别出来
          if git diff --cached --quiet; then
            echo ".last-sent 没有变化，无需提交"
            exit 0
          fi
          git commit -m "记录发送日期 $(cat .last-sent)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
